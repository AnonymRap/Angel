<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapael And Estetica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=Work+Sans:wght@400;500;600&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FAF3EC;
    --paper:#F4E4DE;
    --wine:#6B2737;
    --wine-deep:#4A1A26;
    --rose:#C98A93;
    --gold:#B98A2F;
    --ink:#2B1B21;
    --ink-soft:#5A4750;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--ivory);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    line-height:1.6;
    overflow-x:hidden;
    position:relative;
  }

  .heart-field{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;}
  .heart-field svg{position:absolute; opacity:0.07;}

  header, main, footer{position:relative; z-index:1;}

  /* ---------- HERO ---------- */
  .hero{
    max-width:1180px;
    margin:0 auto;
    padding:5rem 1.5rem 4rem;
    display:grid;
    grid-template-columns:1.1fr 0.9fr;
    gap:3rem;
    align-items:center;
  }
  .hero-text .eyebrow-heart{font-size:1.6rem; color:var(--rose); margin-bottom:0.6rem;}
  .hero-text h1{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(2.6rem, 5vw, 4.2rem);
    line-height:1.05;
    margin:0 0 1.2rem;
    color:var(--wine-deep);
  }
  .hero-text p{
    font-size:1.08rem;
    color:var(--ink-soft);
    max-width:38ch;
    margin:0 0 1.8rem;
  }
  .hero-note{
    display:inline-flex;
    align-items:center;
    gap:0.5rem;
    font-family:'Caveat', cursive;
    font-size:1.4rem;
    color:var(--wine);
  }

  .hero-polaroid{
    background:#fff;
    padding:14px 14px 46px;
    box-shadow:0 18px 40px rgba(43,27,33,0.18);
    transform:rotate(4deg);
    justify-self:center;
    max-width:340px;
    width:100%;
    position:relative;
  }
  .hero-polaroid .frame{
    width:100%;
    aspect-ratio:4/5;
    overflow:hidden;
    background:var(--paper);
  }
  .hero-polaroid .frame img{width:100%; height:100%; object-fit:cover; display:block;}
  .hero-polaroid figcaption{
    position:absolute;
    bottom:12px; left:0; right:0;
    text-align:center;
    font-family:'Caveat', cursive;
    font-size:1.3rem;
    color:var(--ink-soft);
  }

  /* ---------- GALLERY ---------- */
  .gallery-section{max-width:1180px; margin:0 auto; padding:1rem 1.5rem 6rem;}
  .gallery-head{
    margin-bottom:2rem;
    border-bottom:1px solid rgba(107,39,55,0.15);
    padding-bottom:1.2rem;
  }
  .gallery-head h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.9rem;
    color:var(--wine-deep);
    margin:0;
  }
  .gallery-head p{margin:0.3rem 0 0; color:var(--ink-soft); font-size:0.95rem;}

  .masonry{
    columns:4 260px;
    column-gap:1.4rem;
  }
  @media (max-width:900px){ .masonry{columns:2 220px;} }
  @media (max-width:520px){ .masonry{columns:1;} }

  .card{
    break-inside:avoid;
    margin-bottom:1.4rem;
    display:block;
  }

  .polaroid{
    background:#fff;
    padding:10px 10px 34px;
    box-shadow:0 10px 22px rgba(43,27,33,0.15);
    position:relative;
  }
  .polaroid:nth-child(4n+1){transform:rotate(-2.5deg);}
  .polaroid:nth-child(4n+2){transform:rotate(1.8deg);}
  .polaroid:nth-child(4n+3){transform:rotate(-1.2deg);}
  .polaroid:nth-child(4n+4){transform:rotate(2.6deg);}
  .polaroid:hover{transform:rotate(0deg) scale(1.03); transition:transform 0.25s ease; z-index:5;}
  .polaroid img{width:100%; display:block; object-fit:cover;}
  .polaroid .caption{
    position:absolute; bottom:8px; left:0; right:0;
    text-align:center;
    font-family:'Caveat', cursive;
    color:var(--ink-soft);
    font-size:1.05rem;
  }

  .note-card{
    background:var(--paper);
    padding:1.6rem 1.4rem;
    box-shadow:0 8px 18px rgba(43,27,33,0.12);
    font-family:'Caveat', cursive;
    font-size:1.5rem;
    line-height:1.35;
    color:var(--wine-deep);
    position:relative;
  }
  .note-card:before{
    content:'';
    position:absolute; top:-10px; left:50%;
    transform:translateX(-50%);
    width:34px; height:14px;
    background:rgba(185,138,47,0.55);
  }
  .note-card:nth-child(odd){transform:rotate(-1.6deg);}
  .note-card:nth-child(even){transform:rotate(1.4deg);}
  .note-card .heart-tag{display:block; margin-top:0.6rem; font-size:1.2rem;}

  /* ---------- FOOTER ---------- */
  footer{
    max-width:1180px;
    margin:0 auto;
    padding:3rem 1.5rem 4rem;
    text-align:center;
    border-top:1px solid rgba(107,39,55,0.15);
  }
  footer .divider{color:var(--rose); font-size:1.4rem; margin-bottom:1rem;}
  footer p{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:1.3rem;
    color:var(--wine-deep);
    max-width:32ch;
    margin:0 auto;
  }
  footer small{display:block; margin-top:1.2rem; color:var(--ink-soft); font-size:0.8rem;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }

  @media (max-width:760px){
    .hero{grid-template-columns:1fr; text-align:center;}
    .hero-text p, .hero-text .hero-note{margin-left:auto; margin-right:auto;}
    .hero-polaroid{order:-1;}
  }
</style>
</head>
<body>

<div class="heart-field" id="heart-field"></div>

<header>
  <section class="hero">
    <div class="hero-text">
      <div class="eyebrow-heart">♥</div>
      <h1>Your World Is My World</h1>
      <p>I'm Blessed To Be Stuck With You.</p>
      <span class="hero-note">♥</span>
    </div>
    <figure class="hero-polaroid">
      <div class="frame">
        <img src="images/photo-04.jpg" alt="Foto berdua di photobooth">
      </div>
      <figcaption>Best Part</figcaption>
    </figure>
  </section>
</header>

<main>
  <section class="gallery-section">
    <div class="gallery-head">
      <h2>Just The Two Of Us</h2>
      <p>Never Gonna Find Nobody Better All My Life.</p>
    </div>

    <div class="masonry" id="masonry"></div>
  </section>
</main>

<footer>
  <div class="divider">♥ ♥ ♥</div>
  <p>Thanks For Coming Into My Life And Making It Much Better.</p>
  <small>Our Gallery</small>
</footer>

<script>
// ---------- decorative floating hearts (subtle, static, low opacity) ----------
(function(){
  const field = document.getElementById('heart-field');
  const positions = [
    {top:'8%', left:'4%', size:40, rot:-15},
    {top:'22%', left:'92%', size:30, rot:20},
    {top:'55%', left:'2%', size:26, rot:10},
    {top:'70%', left:'95%', size:44, rot:-10},
    {top:'90%', left:'8%', size:34, rot:8},
    {top:'38%', left:'50%', size:22, rot:-5},
  ];
  positions.forEach(p=>{
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns,'svg');
    svg.setAttribute('viewBox','0 0 24 24');
    svg.setAttribute('width', p.size);
    svg.setAttribute('height', p.size);
    svg.style.top = p.top; svg.style.left = p.left;
    svg.style.transform = 'rotate('+p.rot+'deg)';
    svg.style.fill = '#6B2737';
    const path = document.createElementNS(ns,'path');
    path.setAttribute('d','M12 21s-7.5-4.6-10-9.3C.4 8.7 2 5 5.6 5c2 0 3.4 1.1 4.4 2.5C11 6.1 12.4 5 14.4 5 18 5 19.6 8.7 22 11.7 19.5 16.4 12 21 12 21z');
    svg.appendChild(path);
    field.appendChild(svg);
  });
})();

// ---------- photo list (edit this to add/remove photos) ----------
const PHOTOS = [
  {src:'images/photo-04.jpg', alt:'Selfie berdua'},
  {src:'images/photo-08.jpg', alt:'Strip photobooth berdua'},
  {src:'images/photo-01.jpg', alt:'Foto solo waktu jalan-jalan'},
  {src:'images/lyric-01.jpg', alt:'Lirik lagu favorit', caption:'♪'},
  {src:'images/photo-06.jpg', alt:'Selfie berdua bersandar'},
  {src:'images/photo-02.jpg', alt:'Foto solo sama ular'},
  {src:'images/photo-09.jpg', alt:'Foto photobooth berdua'},
  {src:'images/lyric-02.jpg', alt:'Lirik lagu favorit', caption:'♪'},
  {src:'images/Angel_01.jpg', alt:'Strip photobooth hitam putih'},
  {src:'images/photo-07.jpg', alt:'Foto sambil pegang photostrip'},
  {src:'images/lyric-03.jpg', alt:'Lirik lagu favorit', caption:'♪'},
  {src:'images/photo-03.jpg', alt:'Selfie close-up'},
];

// ---------- romantic quotes pool (kata-kata random) ----------
const QUOTES = [
  "If I Lose Everything In The Fire, Im Sending All My Love To You.",
  "I Can Spend Hours Admiring Your Beauty.",
  "You'll Never Lose Yourself Half As Much As I Love You.",
  "You Ain't Gotta Be My Lover, For You To Call Me Baby.",
];
function shuffled(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildPolaroidCard(photo){
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = `
    <div class="polaroid">
      <img src="${photo.src}" alt="${photo.alt}" loading="lazy">
      <div class="caption">${photo.caption || '♥'}</div>
    </div>`;
  return div;
}
function buildNoteCard(text){
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = `<div class="note-card">${text}<span class="heart-tag">♥</span></div>`;
  return div;
}

function renderGallery(){
  const masonry = document.getElementById('masonry');
  masonry.innerHTML = '';
  const quotes = shuffled(QUOTES).slice(0, Math.max(2, Math.ceil(PHOTOS.length/3)));
  let qi = 0;

  PHOTOS.forEach((photo, i)=>{
    masonry.appendChild(buildPolaroidCard(photo));
    if((i+1) % 3 === 0 && qi < quotes.length){
      masonry.appendChild(buildNoteCard(quotes[qi]));
      qi++;
    }
  });
  while(qi < quotes.length){
    masonry.appendChild(buildNoteCard(quotes[qi]));
    qi++;
  }
}

renderGallery();
</script>

</body>
</html>
